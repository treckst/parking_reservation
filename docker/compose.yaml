services:
  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CHROMA_PERSIST_PATH: /data
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 4s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking_local_demo
      POSTGRES_DB: parking_graph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_graph"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  graph:
    image: parking-graph:phase01
    ports:
      - "127.0.0.1:8123:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URI: postgres://parking:parking_local_demo@postgres:5432/parking_graph?sslmode=disable
      REDIS_URI: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHECKPOINT_DB_PATH: /state/checkpoints.sqlite3
      APPLICATION_DB_PATH: /state/application.sqlite3
      BOOKING_DB_PATH: /fixtures/parking_november_2026.sqlite3
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-parking-reservation}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    volumes:
      - ../.runtime/graph:/state
      - ../ingested_mock_data:/fixtures
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ok', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30

  api:
    image: parking-api:phase01
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GRAPH_URL: http://graph:8000
      APPLICATION_DB_PATH: /state/application.sqlite3
      CHECKPOINT_DB_PATH: /state/unused-checkpoints.sqlite3
      BOOKING_DB_PATH: /fixtures/parking_november_2026.sqlite3
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    volumes:
      - ../.runtime:/state
      - ../ingested_mock_data:/fixtures
    depends_on:
      graph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  chroma_data:
  postgres_data:
