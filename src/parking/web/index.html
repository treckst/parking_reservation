<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parking assistant</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">LOCAL PARKING DEMO</p><h1>Parking assistant</h1></div><button id="new-chat" type="button">New chat</button></header>
    <p>Reserve parking or ask about City Centre, Riverside, Station or Airport. Please write in English.</p>
    <section id="messages" aria-label="Conversation" aria-live="polite"></section>
    <p id="error" role="status"></p>
    <button id="retry" type="button" hidden>Retry</button>
    <form id="composer">
      <label for="message">Your message</label>
      <textarea id="message" name="message" maxlength="4000" rows="3" placeholder="I'd like to reserve parking at Airport on November 13, 2026, from 2pm to 9pm."></textarea>
      <button id="send" type="submit" disabled>Send</button>
    </form>
    <footer>Reservation requests need a spot ID, visit times, your name and vehicle plate. Administrator approval is required.</footer>
  </main>
</body>
</html>
