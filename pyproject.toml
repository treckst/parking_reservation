[project]
name = "parking-reservation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "langchain>=1.4.9",
    "langchain-chroma>=1.0",
    "langchain-community>=0.4",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "pydantic>=2.14.3",
    "pypdf>=6.0",
    "python-dotenv>=1.2.4",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langgraph-sdk==0.4.14",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "langchain-classic>=1.0.8",
    "rank-bm25==0.2.2",
]

[dependency-groups]
dev = [
    "langgraph-cli==0.4.42",
    "langgraph-checkpoint-conformance==0.0.2",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parking*"]

[tool.setuptools.package-data]
"parking" = ["web/*.html", "web/*.mjs", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "integration: component integration checks",
    "deployed: requires the built Agent Server and API",
    "live_model: calls the configured external model or embedding service",
]
